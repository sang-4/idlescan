name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install idlescan (no deps)
        run: pip install -e .
      - name: Run test suite
        run: python -m unittest discover -s tests
      - name: Run selftest
        run: python -m idlescan selftest
      - name: Run doctor offline
        run: python -m idlescan doctor --offline
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check idlescan tests
          ruff format --check idlescan tests
      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy idlescan
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
      - name: Install wheel in clean venv and smoke-test
        run: |
          python -m venv .venv
          .venv/bin/pip install dist/*.whl
          .venv/bin/idlescan --help
          .venv/bin/python -m idlescan selftest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release artifacts
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
