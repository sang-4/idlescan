<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080b10">
<title>idlescan — airdrop research desk</title>
<meta name="description" content="Self-hosted airdrop research desk: idle balances, unclaimed allocations, claim planning and verified risk signals.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>

<div class="shell">
  <header class="topbar">
    <a class="brand" href="#/overview" aria-label="idlescan home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M4 22.5 12 9l5 8.5L21 11l7 11.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="9" r="2.6" fill="currentColor"/>
        <circle cx="21" cy="11" r="2" fill="currentColor" opacity=".55"/>
      </svg>
      <span class="brand-text">
        <strong>idlescan</strong>
        <span class="brand-sub">airdrop research desk</span>
      </span>
    </a>

    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#/overview" data-route="overview">Overview</a>
      <a href="#/check" data-route="check">Check</a>
      <a href="#/drops" data-route="drops">Airdrops</a>
      <a href="#/claims" data-route="claims">Claims</a>
      <a href="#/wallets" data-route="wallets">Wallets</a>
      <a href="#/alerts" data-route="alerts">Alerts <span class="nav-count" id="alert-count" hidden></span></a>
      <a href="#/activity" data-route="activity">Activity</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>

    <div class="top-actions">
      <button class="search-trigger" id="command-trigger" type="button" aria-label="Search airdrops and wallets" aria-keyshortcuts="Control+K Meta+K /">
        <span class="search-glyph" aria-hidden="true">⌕</span>
        <span class="search-hint">Search…</span>
        <kbd>⌘K</kbd>
      </button>
      <span class="mode-pill" id="mode-pill" title="Claim hand-off mode">…</span>
      <button class="btn btn-primary btn-scan" id="scan-btn" type="button" aria-label="Scan now">
        <span class="spinner" hidden></span><span class="scan-icon" aria-hidden="true">⟳</span><span class="scan-label">Scan now</span>
      </button>
    </div>
  </header>

  <div id="banners" class="banners" role="status"></div>
  <main id="app" class="view" tabindex="-1">
    <div class="loading-block">
      <div class="skeleton wide"></div>
      <div class="skeleton"></div>
      <div class="skeleton short"></div>
    </div>
  </main>
  <footer class="footer">
    <span><strong>Read-only by default.</strong> No keys, no signing, no broadcasts from the server.</span>
    <span class="footer-meta" id="footer-meta"></span>
  </footer>
</div>

<div id="modal-root"></div>
<div id="palette-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
